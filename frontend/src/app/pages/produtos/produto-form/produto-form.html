<div class="produto-form-container">
    <div class="form-header">
        <h1>{{ isEditMode() ? 'Editar Produto' : 'Novo Produto' }}</h1>
        <a routerLink="/produtos" class="btn-secondary">
            <i class="icon-arrow-left"></i>
            Voltar
        </a>
    </div>

    <form [formGroup]="produtoForm" (ngSubmit)="onSubmit()" class="produto-form">
        <div class="form-group">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" formControlName="nome" class="form-control"
                [class.error]="hasFieldError('nome')" placeholder="Digite o nome do produto">
            <div class="error-message" *ngIf="hasFieldError('nome')">
                {{ getFieldError('nome') }}
            </div>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição *</label>
            <textarea id="descricao" formControlName="descricao" class="form-control"
                [class.error]="hasFieldError('descricao')" placeholder="Digite a descrição do produto"
                rows="4"></textarea>
            <div class="error-message" *ngIf="hasFieldError('descricao')">
                {{ getFieldError('descricao') }}
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="preco">Preço *</label>
                <input type="number" id="preco" formControlName="preco" class="form-control"
                    [class.error]="hasFieldError('preco')" placeholder="0.00" step="0.01" min="0.01">
                <div class="error-message" *ngIf="hasFieldError('preco')">
                    {{ getFieldError('preco') }}
                </div>
            </div>

            <div class="form-group">
                <label for="quantidadeEstoque">Quantidade em Estoque *</label>
                <input type="number" id="quantidadeEstoque" formControlName="quantidadeEstoque" class="form-control"
                    [class.error]="hasFieldError('quantidadeEstoque')" placeholder="0" min="0">
                <div class="error-message" *ngIf="hasFieldError('quantidadeEstoque')">
                    {{ getFieldError('quantidadeEstoque') }}
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="button" routerLink="/produtos" class="btn-cancel">
                Cancelar
            </button>
            <button type="submit" class="btn-primary" [disabled]="isLoading()">
                <span *ngIf="isLoading()" class="spinner"></span>
                {{ isEditMode() ? 'Atualizar' : 'Criar' }} Produto
            </button>
        </div>
    </form>
</div>
