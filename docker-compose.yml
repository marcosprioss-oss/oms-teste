version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pedidos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
        DB_HOST: postgres
        DB_PORT: 5432
        DB_NAME: pedidos
        DB_USER: postgres
        DB_PASSWORD: postgres
        REDIS_HOST: redis
        REDIS_PORT: 6379

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

volumes:
  pgdata:
