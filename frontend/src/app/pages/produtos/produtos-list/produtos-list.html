<div class="produtos-container">
    <mat-toolbar class="header-toolbar">
        <span>Gerenciamento de Produtos</span>
        <span class="spacer"></span>
        <button mat-raised-button color="primary" routerLink="/novo">
            <mat-icon>add</mat-icon>
            Novo Produto
        </button>
    </mat-toolbar>

    <mat-card class="table-card">
        <mat-card-content>
            <table mat-table [dataSource]="produtos()" class="produtos-table">
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>ID</th>
                    <td mat-cell *matCellDef="let produto">{{ produto.id }}</td>
                </ng-container>

                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef>Nome</th>
                    <td mat-cell *matCellDef="let produto">{{ produto.nome }}</td>
                </ng-container>

                <ng-container matColumnDef="descricao">
                    <th mat-header-cell *matHeaderCellDef>Descrição</th>
                    <td mat-cell *matCellDef="let produto">{{ produto.descricao }}</td>
                </ng-container>

                <ng-container matColumnDef="preco">
                    <th mat-header-cell *matHeaderCellDef>Preço</th>
                    <td mat-cell *matCellDef="let produto">{{ produto.preco | currency:'BRL':'symbol':'1.2-2' }}</td>
                </ng-container>

                <ng-container matColumnDef="estoque">
                    <th mat-header-cell *matHeaderCellDef>Estoque</th>
                    <td mat-cell *matCellDef="let produto">
                        <span [class]="produto.quantidade > 0 ? 'stock-available' : 'stock-unavailable'">
                            {{ produto.quantidade }}
                        </span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="acoes">
                    <th mat-header-cell *matHeaderCellDef>Ações</th>
                    <td mat-cell *matCellDef="let produto">
                        <button mat-icon-button color="warn" [routerLink]="['/produtos', produto.id]" title="Editar">
                            <mat-icon>edit</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

            <div class="no-data" *ngIf="produtos()?.length === 0">
                <mat-icon>inbox</mat-icon>
                <p>Nenhum produto encontrado</p>
            </div>
        </mat-card-content>

        <mat-paginator [length]="totalElements()" [pageSize]="pageSize()" [pageIndex]="currentPage()"
            [pageSizeOptions]="[5, 10, 25, 50]" (page)="onPageChange($event)" showFirstLastButtons>
        </mat-paginator>
    </mat-card>
</div>
