<div class="produto-form-container">
    <mat-toolbar class="form-toolbar">
        <button mat-icon-button routerLink="/produtos">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <span>{{ isEditMode() ? 'Editar Produto' : 'Novo Produto' }}</span>
    </mat-toolbar>

    <mat-card class="form-card">
        <mat-card-content>
            <form [formGroup]="produtoForm" (ngSubmit)="onSubmit()" class="produto-form">
                <div class="form-row">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Nome *</mat-label>
                        <input matInput formControlName="nome" placeholder="Digite o nome do produto"
                            [readonly]="isEditMode()">
                        <mat-error *ngIf="hasFieldError('nome')">
                            {{ getFieldError('nome') }}
                        </mat-error>
                    </mat-form-field>
                </div>

                <div class="form-row">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Descrição *</mat-label>
                        <textarea matInput formControlName="descricao" placeholder="Digite a descrição do produto"
                            [readonly]="isEditMode()" rows="4"></textarea>
                        <mat-error *ngIf="hasFieldError('descricao')">
                            {{ getFieldError('descricao') }}
                        </mat-error>
                    </mat-form-field>
                </div>

                <div class="form-row two-columns">
                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Preço *</mat-label>
                        <input matInput type="number" formControlName="preco" placeholder="0.00" step="0.01" min="0.01"
                            [readonly]="isEditMode()">
                        <span matPrefix>R$&nbsp;</span>
                        <mat-error *ngIf="hasFieldError('preco')">
                            {{ getFieldError('preco') }}
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Quantidade em Estoque *</mat-label>
                        <input matInput type="number" formControlName="quantidade" placeholder="0" min="0">
                        <mat-error *ngIf="hasFieldError('quantidade')">
                            {{ getFieldError('quantidade') }}
                        </mat-error>
                    </mat-form-field>
                </div>

                <div class="form-actions">
                    <button mat-raised-button type="button" routerLink="/produtos" class="cancel-button">
                        Cancelar
                    </button>
                    <button mat-raised-button color="primary" type="submit" [disabled]="isLoading()"
                        class="submit-button">
                        <mat-icon *ngIf="isLoading()">refresh</mat-icon>
                        {{ isEditMode() ? 'Atualizar' : 'Criar' }} Produto
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
