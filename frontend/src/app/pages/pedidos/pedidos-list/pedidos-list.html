<div class="pedidos-container">
    <div class="header">
        <h1>Gerenciamento de Pedidos</h1>
        <div class="actions">
            <a routerLink="/novo-pedido" class="btn-primary">
                <i class="icon-plus"></i>
                Novo Pedido
            </a>
        </div>
    </div>

    <div class="dashboard">
        <div class="stats-grid">
            <div class="stat-card" *ngFor="let stat of estatisticas() | keyvalue">
                <div class="stat-value">{{ stat.value }}</div>
                <div class="stat-label">{{ stat.key }}</div>
            </div>
        </div>
    </div>

    <div class="filters">
        <div class="filter-group">
            <label for="status">Status:</label>
            <select id="status" [(ngModel)]="statusFilter" (ngModelChange)="onFilterChange()" class="filter-select">
                <option *ngFor="let option of getStatusOptions()" [value]="option.value">
                    {{ option.label }}
                </option>
            </select>
        </div>

        <button (click)="limparFiltros()" class="btn-secondary">
            Limpar Filtros
        </button>
    </div>

    <div class="table-container">
        <table mat-table [dataSource]="pedidos()" class="pedidos-table">
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let pedido">{{ pedido.id }}</td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let pedido">
                    <app-status-badge [status]="pedido.status"></app-status-badge>
                </td>
            </ng-container>

            <ng-container matColumnDef="valorTotal">
                <th mat-header-cell *matHeaderCellDef>Valor Total</th>
                <td mat-cell *matCellDef="let pedido">{{ pedido.total | currency:'BRL':'symbol':'1.2-2' }}</td>
            </ng-container>

            <ng-container matColumnDef="item">
                <th mat-header-cell *matHeaderCellDef>Items</th>
                <td mat-cell *matCellDef="let pedido">{{ pedido.items.length }} item(s)</td>
            </ng-container>

            <ng-container matColumnDef="acoes">
                <th mat-header-cell *matHeaderCellDef>Ações</th>
                <td mat-cell *matCellDef="let pedido">
                    <a [routerLink]="['/pedidos', pedido.id]" class="btn-info btn-sm" title="Ver Detalhes">
                        <i class="icon-eye"></i>
                    </a>
                    <button *ngIf="podeCancelar(pedido.status)" (click)="cancelarPedido(pedido.id!)"
                        class="btn-danger btn-sm" title="Cancelar">
                        <i class="icon-cancel"></i>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
    </div>

    <div class="pagination" *ngIf="totalPages() > 1">
        <button (click)="onPageChange(currentPage() - 1)" [disabled]="currentPage() === 0" class="btn-pagination">
            Anterior
        </button>

        <span *ngFor="let page of getPages()" (click)="onPageChange(page)"
            [class]="page === currentPage() ? 'page-number active' : 'page-number'">
            {{ page + 1 }}
        </span>

        <button (click)="onPageChange(currentPage() + 1)" [disabled]="currentPage() === totalPages() - 1"
            class="btn-pagination">
            Próximo
        </button>
    </div>

    <div class="pagination-info">
        Mostrando {{ pedidos()?.length }} de {{ totalElements() }} pedidos
    </div>
</div>
